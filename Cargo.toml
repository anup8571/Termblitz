[package]
name = "termblitz"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["bracketed-paste", "events"] }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
