[package]
name = "termblitz"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.28"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
